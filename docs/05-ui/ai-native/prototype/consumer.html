<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5fbfc"><title>AI运动 · 发现你的下一场</title><link rel="stylesheet" href="consumer.css"></head>
<body>
<svg class="icon-definitions" aria-hidden="true"><defs>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h3m3 0h3"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c1 7 3 9 10 10-7 1-9 3-10 10-1-7-3-9-10-10 7-1 9-3 10-10Z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 4h18l-7 8v7l-4 2v-9Z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21S2 15 2 8c0-6 7-7 10-2 3-5 10-4 10 2 0 7-10 13-10 13Z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-racket" viewBox="0 0 24 24"><ellipse cx="14" cy="8" rx="6" ry="7" transform="rotate(35 14 8)"/><path d="m10 14-7 8m6-6 2 2m1-15 7 8m-9-4 7 8"/></symbol>
</defs></svg>
<a class="skip-link" href="#main">跳到页面内容</a>
<header class="site-header"><div class="header-inner">
<a class="brand" href="#discover" aria-label="AI运动首页"><svg viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="brand-gradient" x2="1" y2="1"><stop stop-color="#9ee4dc"/><stop offset=".6" stop-color="#039bac"/><stop offset="1" stop-color="#0c6593"/></linearGradient></defs><path d="M7 35 20 8q2-4 4 0l13 27" fill="none" stroke="url(#brand-gradient)" stroke-width="8" stroke-linecap="round"/><path d="M18 25h15" stroke="#8680ee" stroke-width="6" stroke-linecap="round"/></svg><strong>AI运动</strong></a>
<button class="city-control" data-action="city"><svg class="icon"><use href="#i-pin"/></svg><span id="city-label">保定</span><span class="down">⌄</span></button>
<nav class="desktop-nav" aria-label="主导航"><a href="#discover" data-route="discover">发现</a><a href="#events" data-route="events">赛事</a><a href="#participation" data-route="participation">我的参赛</a></nav>
<div class="account"><span class="prototype-label">交互原型 · 示例数据</span><button class="icon-button notification" data-action="messages" aria-label="消息"><svg class="icon"><use href="#i-bell"/></svg><i></i></button><a href="#profile" class="profile-button" aria-label="我的"><span class="avatar">林</span><span>我的</span></a></div>
</div></header>
<main id="main" tabindex="-1"></main>
<footer class="site-footer"><span class="footer-brand">AI运动</span><span>让每一次参与，都成为新的开始。</span><span>独立设计原型 · 全部赛事与个人状态均为示例</span><a href="ai-workbench.html">进入办赛工作台 <span aria-hidden="true">↗</span></a></footer>
<nav class="mobile-nav" aria-label="移动端主导航"><a href="#discover" data-route="discover"><svg class="icon"><use href="#i-home"/></svg><span>发现</span></a><a href="#events" data-route="events"><svg class="icon"><use href="#i-calendar"/></svg><span>赛事</span></a><button class="mobile-ai" data-action="open-assistant" aria-label="打开 AI 参赛助手"><svg class="icon"><use href="#i-spark"/></svg><span>AI 助手</span></button><a href="#participation" data-route="participation"><svg class="icon"><use href="#i-file"/></svg><span>参赛</span></a><a href="#profile" data-route="profile"><svg class="icon"><use href="#i-user"/></svg><span>我的</span></a></nav>
<button id="ai-launcher" aria-label="打开 AI 参赛助手" aria-expanded="false"><span><svg class="icon"><use href="#i-spark"/></svg></span><small>AI 助手</small></button>
<section id="assistant" role="dialog" aria-label="AI参赛助手" hidden>
<div class="assistant-heading"><div class="assistant-name"><span class="ai-symbol"><svg class="icon"><use href="#i-spark"/></svg></span><div><strong>AI 参赛助手</strong><small>一起找到适合你的下一场</small></div></div><div class="assistant-controls"><button class="icon-button" id="ai-expand" aria-label="放大聊天窗口"><svg class="icon"><use href="#i-expand"/></svg></button><button class="icon-button" id="ai-close" aria-label="关闭聊天窗口"><svg class="icon"><use href="#i-close"/></svg></button></div></div>
<div id="assistant-context"></div><div id="assistant-messages" aria-live="polite"></div>
<div class="assistant-shortcuts"><button data-ai="周末有哪些适合我的比赛？">AI 找赛事</button><button data-ai="帮我看懂当前赛事规程">看懂规程</button><button data-ai="我的参赛下一步是什么？">我的下一步</button></div>
<form id="assistant-form"><textarea id="assistant-input" aria-label="发给 AI 的消息" placeholder="说说你想参加什么比赛…" rows="2" maxlength="500" required></textarea><button class="ai-send" type="submit" aria-label="发送消息"><svg class="icon"><use href="#i-arrow"/></svg></button></form><div class="assistant-note">本地示例回复 · 未接入模型，不自动报名或付款</div>
</section>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="consumer.js"></script>
</body></html>
