worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # SSE authentication can appear in queries; record only the path.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 40m;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location /prod-api/ {
            proxy_pass http://backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
        location ~* \.(?:js|css|woff2?|svg)$ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=86400';
        }
    }
}
