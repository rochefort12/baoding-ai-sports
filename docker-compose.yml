name: ${COMPOSE_PROJECT_NAME:-aisports-dev}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Run Initialize-Environment.ps1 first}
    container_name: aisports-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/script/sql/postgres/postgres_ry_vue_5.X.sql:/docker-entrypoint-initdb.d/10-ruoyi.sql:ro
      - ./backend/script/sql/postgres/postgres_ry_workflow.sql:/docker-entrypoint-initdb.d/20-workflow.sql:ro
      - ./database/migrations/V001__aisports_core.sql:/docker-entrypoint-initdb.d/30-aisports.sql:ro
      - ./.local/postgres/90-role-and-history.sql:/docker-entrypoint-initdb.d/90-role-and-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aisports]
  redis:
    image: ${REDIS_IMAGE:?Run Initialize-Environment.ps1 first}
    container_name: aisports-dev-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
      - ./.local/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aisports]
  minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: aisports-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruoyi123}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    networks: [aisports]
volumes:
  postgres-data:
    name: aisports-dev-postgres-data
  redis-data:
    name: aisports-dev-redis-data
  minio-data:
    name: aisports-dev-minio-data
networks:
  aisports:
    name: aisports-dev-network
